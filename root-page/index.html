<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mtbbs 项目导航</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 24px;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 40px;
    }
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .project-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s, transform 0.15s;
      display: block;
    }
    .project-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .project-name {
      font-size: 16px;
      font-weight: 600;
      color: #4361ee;
      margin-bottom: 4px;
    }
    .project-desc {
      font-size: 13px;
      color: #666;
    }
    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
    footer a {
      color: #4361ee;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>mtbbs 项目导航</h1>
    <p class="subtitle">GitHub Pages 多项目部署演示</p>

    <div class="project-list">
      <a href="mt-convert/" class="project-card">
        <div class="project-name">MT Convert 转换器</div>
        <div class="project-desc">Markdown / BBCode / HTML 互转工具</div>
      </a>
      <a href="demo/" class="project-card">
        <div class="project-name">Demo 项目</div>
        <div class="project-desc">多项目构建部署验证占位项目</div>
      </a>
    </div>

    <footer>
      <a href="https://github.com/qcxs/mtbbs" target="_blank">qcxs/mtbbs</a>
    </footer>
  </div>
</body>
</html>
