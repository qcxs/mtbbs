name: Build and Deploy mt-convert

on:
  push:
    branches:
      - main
    paths:
      - 'mt-convert/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "mt-convert-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mt-convert
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mt-convert/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mt-convert/dist
          destination_dir: mt-convert
          keep_files: true
