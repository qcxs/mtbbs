    <meta name="keywords" content="MT转换,Markdown转BBCode,BBCode转HTML,论坛格式转换,文本转换工具,在线转换器,MT论坛">
    <meta name="author" content="青春向上">
    <meta name="application-name" content="MT Convert 转换器">
    <meta property="og:title" content="MT Convert 转换器 - Markdown/BBCode/HTML 互转">
    <meta property="og:description" content="在线论坛文本格式转换工具，支持 Markdown 转 BBCode、BBCode 转 HTML 互转。">
    <meta property="og:type" content="website">

    <link rel="canonical" href="https://github.com/qcxs/mtbbs">
    <link rel="stylesheet" href="./css/vendor/element-plus.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#999;font-size:14px">
            加载中...
        </div>
    </div>

    <script src="./js/vendor/vue.global.js"></script>
    <script src="./js/vendor/vue-router.global.js"></script>
    <script src="./js/vendor/element-plus.js"></script>

    <script src="./static/js/common_smilies_var.js"></script>
    <script src="./static/js/BBCode2Html.js"></script>
    <script src="./static/js/Markdown2BBCode.js"></script>
    <script src="./js/components/app-footer.js"></script>
    <script src="./js/pages/md-to-bbcode.js"></script>
    <script src="./js/pages/bbcode-to-html.js"></script>
    <script src="./js/router.js"></script>
    <script src="./js/app.js"></script>

<script>
// 全局拖放处理
document.addEventListener('DOMContentLoaded', function() {
    const dropZone = document.body;
    
    // 创建拖放提示弹窗
    function createDropHint() {
        const overlay = document.createElement('div');
        overlay.className = 'drop-hint-overlay';
        overlay.innerHTML = `
            <div class="drop-hint-container">
                <div class="drop-hint-icon">📁</div>
                <div class="drop-hint-title">拖到此处自动上传</div>
                <div class="drop-hint-desc">释放文件即可自动加载内容</div>
            </div>
        `;
        document.body.appendChild(overlay);
        return overlay;
    }
    
    const dropHintOverlay = createDropHint();
    
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('drag-over');
        dropHintOverlay.classList.add('show');
    });
    
    dropZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        e.stopPropagation();
        // 只有当鼠标真正离开页面时才隐藏
        const rect = dropZone.getBoundingClientRect();
        if (e.clientX <= rect.left || e.clientX >= rect.right ||
            e.clientY <= rect.top || e.clientY >= rect.bottom) {
            dropZone.classList.remove('drag-over');
            dropHintOverlay.classList.remove('show');
        }
    });
    
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');
        dropHintOverlay.classList.remove('show');
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            const file = files[0];
            handleDroppedFile(file);
        }
    });
    
    // 处理拖放的文件
    window.handleDroppedFile = function(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            // 触发全局自定义事件
            window.dispatchEvent(new CustomEvent('file-dropped', { 
                detail: { content: content }
            }));
        };
        reader.readAsText(file, 'utf-8');
    };
});
</script>
</body>
</html>
